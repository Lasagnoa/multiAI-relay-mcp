[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multiai-relay-mcp"
version = "1.0.20"
description = "Claude and Codex collaborate via MCP — shared state, handoff, and session relay"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Lasagnoa"}]
keywords = ["mcp", "claude", "codex", "ai", "collaboration", "handoff", "relay", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp[cli]>=1.0.0"]


[project.scripts]
multiai-relay-mcp = "multiai_relay_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio[trio]>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/multiai_relay_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
